# ============================================================
# 推荐规则
# ============================================================
recommendation_rules:
  # 多维度匹配
  matching_dimensions:
    - content: 视频内容（扣篮/比赛/技术/致敬）
    - mood: 视频情绪（激昂/怀旧/感人/搞笑）
    - style: 音乐风格偏好（摇滚/电子/嘻哈/管弦/Lo-Fi）
    - player: 球员风格（暴力美学/技术流/团队篮球/传奇）
    - duration: 视频时长

  # 根据视频内容关键词匹配分类
  content_keywords:
    high_energy:
      - "扣篮"
      - "集锦"
      - "高光"
      - "十佳球"
      - "劲爆"
      - "天赋"
      - "暴力"
      - "绝杀"
      - "dunk"
      - "highlights"
      - "top 10"
      - "mixtape"
    medium_energy:
      - "比赛"
      - "回顾"
      - "技术"
      - "分析"
      - "球员"
      - "介绍"
      - "战术"
      - "赛季"
      - "交易"
      - "game"
      - "review"
